<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joana</title>
  <meta name="description" content="Joana">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'><path d='M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z'/></svg>">
  <style>
    :root {
      --ink: #000;
      --paper: #fff;
      /* 34 columns across the name; scale pixels to fit any screen */
      --px: min(20px, calc((100vw - 32px) / 34));
      --hp: max(5px, calc(var(--px) / 1.6));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Cursor-reactive pixel grid behind everything */
    #grid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--px) * 3);
      padding: 0 16px;
    }

    .name {
      display: flex;
      gap: var(--px);
      perspective: 600px;
      cursor: pointer;
    }

    .glyph {
      display: grid;
      transform-origin: 50% 50%;
    }

    /* split-flap style flip, run letter by letter */
    .glyph.flip { animation: flip .6s both; }

    @keyframes flip {
      0%    { transform: rotateX(0); animation-timing-function: ease-in; }
      40%   { transform: rotateX(-90deg); }
      40.1% { transform: rotateX(90deg); animation-timing-function: cubic-bezier(.3, 1.6, .5, 1); }
      100%  { transform: rotateX(0); }
    }

    .glyph i, .heart i {
      display: block;
      width: var(--px);
      height: var(--px);
    }

    /* the hairline shadow closes seams when pixel sizes land on fractions */
    i.lit { background: var(--ink); box-shadow: 0 0 0 .5px var(--ink); }

    .heart { display: grid; }
    .heart i { width: var(--hp); height: var(--hp); }
    .heart.beat { animation: beat 1.2s steps(1) infinite; }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      12%      { transform: scale(1.25); }
      24%      { transform: scale(1); }
      36%      { transform: scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart.beat, .glyph.flip { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="grid" aria-hidden="true"></canvas>

  <main>
    <h1 class="name" id="name" aria-label="Joana"></h1>
    <div class="heart" id="heart" aria-hidden="true"></div>
  </main>

  <script>
    const GLYPHS = {
      J: ["..####", "....##", "....##", "....##", "##..##", "##..##", ".####."],
      O: [".####.", "##..##", "##..##", "##..##", "##..##", "##..##", ".####."],
      A: [".####.", "##..##", "##..##", "######", "##..##", "##..##", "##..##"],
      N: ["##..##", "###.##", "######", "##.###", "##..##", "##..##", "##..##"],
    };
    const HEART = [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."];

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const name = document.getElementById("name");
    const heart = document.getElementById("heart");

    /* ---------- Name + heart, assembled pixel by pixel ---------- */

    // Fill a grid element from a bitmap; return its "on" pixels.
    function fill(el, rows) {
      el.innerHTML = "";
      el.style.gridTemplateColumns = `repeat(${rows[0].length}, auto)`;
      const on = [];
      rows.forEach(row => [...row].forEach(c => {
        const i = document.createElement("i");
        if (c === "#") on.push(i);
        el.appendChild(i);
      }));
      return on;
    }

    const shuffle = a => a.sort(() => Math.random() - 0.5);
    let run = 0;

    function assemble() {
      const id = ++run;
      heart.classList.remove("beat");
      name.innerHTML = "";
      const letters = [..."JOANA"].flatMap(ch => {
        const g = document.createElement("span");
        g.className = "glyph";
        g.setAttribute("aria-hidden", "true");
        name.appendChild(g);
        return fill(g, GLYPHS[ch]);
      });
      // Name pixels over 1.2s, then heart pixels over 0.5s.
      const steps = [
        ...shuffle(letters).map((i, n, a) => [i, (n / a.length) * 1200]),
        ...shuffle(fill(heart, HEART)).map((i, n, a) => [i, 1300 + (n / a.length) * 500]),
      ];
      if (reduceMotion) { steps.forEach(([i]) => i.classList.add("lit")); return; }
      const t0 = performance.now();
      let k = 0;
      (function tick(now) {
        if (id !== run) return;
        while (k < steps.length && steps[k][1] <= now - t0) steps[k++][0].classList.add("lit");
        if (k < steps.length) requestAnimationFrame(tick);
        else setTimeout(() => id === run && heart.classList.add("beat"), 500);
      })(t0);
    }

    /* ---------- Letter cascade: flip each letter in a wave ---------- */

    let flipping = false;
    function cascade() {
      if (flipping || reduceMotion) return;
      flipping = true;
      const glyphs = [...name.children];
      glyphs.forEach((g, n) => {
        g.classList.remove("flip");
        void g.offsetWidth; // restart animation
        g.style.animationDelay = `${n * 70}ms`;
        g.classList.add("flip");
      });
      setTimeout(() => { flipping = false; }, glyphs.length * 70 + 600);
    }

    name.addEventListener("pointerenter", cascade);
    name.addEventListener("click", cascade);

    /* ---------- Pixel canvas: cells light up under the cursor and fade ---------- */

    const canvas = document.getElementById("grid");
    const ctx = canvas.getContext("2d");
    let cell, cols, rowsN, heat, dpr;

    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Match the grid to the name's pixel size so everything shares one grid feel.
      cell = parseFloat(getComputedStyle(name.querySelector("i") || name).width) || 16;
      cols = Math.ceil(innerWidth / cell);
      rowsN = Math.ceil(innerHeight / cell);
      heat = new Float32Array(cols * rowsN);
    }

    let active = false;
    function draw() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let any = false;
      for (let n = 0; n < heat.length; n++) {
        const h = heat[n];
        if (h <= 0) continue;
        any = true;
        ctx.fillStyle = `rgba(0,0,0,${h * 0.12})`;
        ctx.fillRect((n % cols) * cell, Math.floor(n / cols) * cell, cell - 1, cell - 1);
        heat[n] = Math.max(0, h - 0.025);
      }
      active = any;
      if (any) requestAnimationFrame(draw);
    }

    function touch(x, y) {
      const c = Math.floor(x / cell), r = Math.floor(y / cell);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const cc = c + dx, rr = r + dy;
        if (cc < 0 || rr < 0 || cc >= cols || rr >= rowsN) continue;
        const v = dx || dy ? 0.45 : 1;
        heat[rr * cols + cc] = Math.max(heat[rr * cols + cc], v);
      }
      if (!active) { active = true; requestAnimationFrame(draw); }
    }

    if (!reduceMotion) {
      addEventListener("pointermove", e => touch(e.clientX, e.clientY));
      addEventListener("pointerdown", e => touch(e.clientX, e.clientY));
    }

    /* ---------- Start ---------- */

    assemble();
    size();
    addEventListener("resize", size);
    // Click empty space to rebuild the name.
    document.addEventListener("click", e => { if (!name.contains(e.target)) assemble(); });
  </script>
</body>
</html>
