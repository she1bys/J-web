<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joana</title>
  <meta name="description" content="For Joana, with love.">
  <meta name="theme-color" content="#1a0b14">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main>
    <section class="hero" id="top">
      <p class="eyebrow">for the one I love</p>
      <h1 class="name" aria-label="Joana">
        <span>J</span><span>o</span><span>a</span><span>n</span><span>a</span>
      </h1>
      <div class="heart-beat" aria-hidden="true">
        <svg viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
      </div>
      <a class="scroll-cue" href="#letters">scroll</a>
    </section>

    <section class="letters" id="letters">
      <div class="letter reveal">
        <span class="big">J</span>
        <p>Joy, in every ordinary day.</p>
      </div>
      <div class="letter reveal">
        <span class="big">O</span>
        <p>Only you, always you.</p>
      </div>
      <div class="letter reveal">
        <span class="big">A</span>
        <p>Always the brightest light in the room.</p>
      </div>
      <div class="letter reveal">
        <span class="big">N</span>
        <p>Now, and every day after.</p>
      </div>
      <div class="letter reveal">
        <span class="big">A</span>
        <p>All my love.</p>
      </div>
    </section>

    <section class="closing reveal">
      <p class="quote">Of all the names in the world,<br>yours is my favourite.</p>
      <p class="signature">Joana</p>
      <button id="love-btn" type="button">Tap for love</button>
      <p class="counter" id="counter" aria-live="polite"></p>
    </section>
  </main>

  <footer>made with <span class="tiny-heart">❤</span> for Joana</footer>

  <script src="script.js"></script>
</body>
</html>
