<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joana</title>
  <meta name="description" content="Joana">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'><path d='M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z'/></svg>">
  <style>
    :root {
      --ink: #000;
      --paper: #fff;
      /* 34 columns across the name; scale pixels to fit any screen */
      --px: min(20px, calc((100vw - 32px) / 34));
      --hp: max(5px, calc(var(--px) / 1.6));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--px) * 3);
      padding: 0 16px;
    }

    .pixels {
      display: grid;
      gap: 0;
      image-rendering: pixelated;
    }

    .pixels i {
      display: block;
      width: var(--px);
      height: var(--px);
    }

    /* the hairline shadow closes seams when pixel sizes land on fractions */
    .pixels i.lit { background: var(--ink); box-shadow: 0 0 0 .5px var(--ink); }

    .heart i { width: var(--hp); height: var(--hp); }
    .heart.beat { animation: beat 1.2s steps(1) infinite; }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      12%      { transform: scale(1.25); }
      24%      { transform: scale(1); }
      36%      { transform: scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart.beat { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="pixels name" id="name" aria-label="Joana"></h1>
    <div class="pixels heart" id="heart" aria-hidden="true"></div>
  </main>

  <script>
    const GLYPHS = {
      J: ["..####", "....##", "....##", "....##", "##..##", "##..##", ".####."],
      O: [".####.", "##..##", "##..##", "##..##", "##..##", "##..##", ".####."],
      A: [".####.", "##..##", "##..##", "######", "##..##", "##..##", "##..##"],
      N: ["##..##", "###.##", "######", "##.###", "##..##", "##..##", "##..##"],
    };
    const HEART = [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."];

    // Join letters into one bitmap with a 1-pixel gap between them.
    function bitmapFor(word) {
      const rows = GLYPHS[word[0]].map(() => "");
      [...word].forEach((ch, i) => {
        GLYPHS[ch].forEach((row, r) => { rows[r] += (i ? "." : "") + row; });
      });
      return rows;
    }

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Build the grid; return its "on" pixels in random order.
    function render(el, rows) {
      el.innerHTML = "";
      el.style.gridTemplateColumns = `repeat(${rows[0].length}, auto)`;
      const on = [];
      rows.forEach(row => [...row].forEach(c => {
        const i = document.createElement("i");
        if (c === "#") on.push(i);
        el.appendChild(i);
      }));
      return on.sort(() => Math.random() - 0.5);
    }

    const name = document.getElementById("name");
    const heart = document.getElementById("heart");
    let run = 0;

    function play() {
      const id = ++run;
      heart.classList.remove("beat");
      // Name pixels over 1.2s, then heart pixels over 0.5s.
      const steps = [
        ...render(name, bitmapFor("JOANA")).map((i, n, a) => [i, (n / a.length) * 1200]),
        ...render(heart, HEART).map((i, n, a) => [i, 1300 + (n / a.length) * 500]),
      ];
      if (reduceMotion) { steps.forEach(([i]) => i.classList.add("lit")); return; }
      const t0 = performance.now();
      let k = 0;
      (function tick(now) {
        if (id !== run) return;
        while (k < steps.length && steps[k][1] <= now - t0) steps[k++][0].classList.add("lit");
        if (k < steps.length) requestAnimationFrame(tick);
        else setTimeout(() => id === run && heart.classList.add("beat"), 500);
      })(t0);
    }

    play();
    document.addEventListener("click", play);
  </script>
</body>
</html>
